/* ============================================================
   1. CORRUPTION MANAGER  (day, sanity, derived parameters)
   ============================================================ */
class CorruptionManager extends Phaser.Events.EventEmitter {
  constructor(){ super(); this.day=1; this.done=new Set(); this.sanity=100; this.pillReadyAt=0; this.mayorMonster=false; }
  get tasks(){ return DAYS[this.day]; }
  get progress(){ return this.done.size/this.tasks.length; }
  get phase(){ return this.day<=2?1:this.day<=5?2:3; }
  // Low sanity pushes visuals harsher, but never past "mild" until Day 6.
  get corruptionLevel(){
    const c=LEVELS[this.day-1]+this.progress*0.05+(1-this.sanity/100)*0.2;
    return Math.min(this.day<=5?0.6:1,c);
  }
  get params(){
    const c=this.corruptionLevel, lerp=Phaser.Math.Linear;
    return { musicPitch:lerp(1,0.6,c), uiJitterAmount:c<0.3?0:lerp(0,6,c), npcFollowSpeed:c<0.5?0:lerp(0,90,(c-0.5)*2),
      lightingDarkness:lerp(0,0.8,c), desaturation:c, controlInvertChance:this.day>=7?0.2:0, phase:this.phase };
  }
  addSanity(d){ this.sanity=Phaser.Math.Clamp(this.sanity+d,0,100); }
  completeTask(id){ if(this.done.has(id)) return false; this.done.add(id); this.emit('task',id); return true; }
  allDone(){ return this.done.size>=this.tasks.length; }
  nextDay(){ this.day=Math.min(10,this.day+1); this.done.clear(); this.sanity=Math.min(100,this.sanity+35); this.mayorMonster=this.day>=7; }
}

/* ============================================================
   SOUND  (all synthesized with Web Audio - no asset files needed)
   Generative music: pentatonic ukulele plucks that slow down, detune,
   drop notes and hit wrong notes as corruption rises; drone fades in.
   ============================================================ */
class Sound {
  constructor(state){ this.state=state; this.ctx=null; this.step=0; this.pos=3; }
  start(){
    if(this.ctx) return; const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const c=this.ctx=new C(); this.out=c.createGain(); this.out.gain.value=0.5; this.out.connect(c.destination);
    this.mel=c.createBiquadFilter(); this.mel.type='lowpass'; this.mel.connect(this.out);
    const lp=c.createBiquadFilter(); lp.frequency.value=180; lp.connect(this.out);
    this.dg=c.createGain(); this.dg.gain.value=0; this.dg.connect(lp);
    [55,55.9].forEach(f=>{ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.connect(this.dg); o.start(); });
    this.loop();
  }
  tone(f,d,type='sine',v=0.2,to=null,dest=null,when=0){
    const c=this.ctx; if(!c) return; const t=c.currentTime+when, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(dest||this.out); o.start(t); o.stop(t+d+0.05);
  }
  noise(d,v=0.2,f=1000,q=1,type='bandpass'){
    const c=this.ctx; if(!c) return; const n=(c.sampleRate*d)|0, b=c.createBuffer(1,n,c.sampleRate), a=b.getChannelData(0);
    for(let i=0;i<n;i++) a[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=b; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    const g=c.createGain(), t=c.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+d*0.3); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl); fl.connect(g); g.connect(this.out); s.start();
  }
  loop(){
    const st=this.state, c=st.corruptionLevel;
    this.mel.frequency.value=7000-6200*c; this.dg.gain.value=c*c*0.14;
    const scale=[0,2,4,7,9,12,14,16]; this.step++; this.pos=Phaser.Math.Clamp(this.pos+Phaser.Math.Between(-2,2),0,7);
    if(!(c>0.45&&Math.random()<c-0.35)){
      let semi=scale[this.pos]; if(c>0.5&&Math.random()<c) semi+=1;         // wrong notes
      this.tone(261.6*Math.pow(2,(semi+(Math.random()-.5)*c*4)/12),0.5,'triangle',0.16,null,this.mel);
    }
    if(st.day===1&&this.step%4===0) this.tone(130.8,0.6,'sine',0.15);         // bassline only on Day 1
    setTimeout(()=>this.loop(),260+520*c);
  }
  sfx(n){
    if(!this.ctx) return; const c=this.state.corruptionLevel;
    switch(n){
      case 'success': if(c<0.55) [523,659,784].forEach((f,i)=>this.tone(f,0.25,'sine',0.18,null,null,i*0.08)); else { this.tone(180,0.5,'sawtooth',0.15,60); this.noise(0.4,0.2,900); } break;
      case 'blip': this.tone(320*(1-c*0.5)+Math.random()*60,0.05,'square',0.04); break;
      case 'crunch': this.noise(0.15,0.5,2500); this.noise(0.12,0.4,1800); break;
      case 'good': [660,880,1100].forEach((f,i)=>this.tone(f,0.2,'sine',0.15,null,null,i*0.06)); break;
      case 'bad': this.tone(220,0.5,'sawtooth',0.12,80); break;
      case 'pill': this.tone(900,0.06,'square',0.1); this.tone(600,0.1,'sine',0.15,300,null,0.07); break;
      case 'whisper': this.noise(1.8,0.3,2400+Math.random()*900,5); this.noise(1.8,0.2,1500,3); break;

class ChecklistUI {
  constructor(scene,state){
    this.scene=scene; this.state=state; this.rows=[]; this.open=state.uiOpen===true; state.uiOpen=this.open;
    const f={fontFamily:FONT};
    // header = the dropdown toggle (click it, or press T)
    this.head=scene.add.rectangle(12,12,250,28,0xfbbf24,0.97).setOrigin(0).setScrollFactor(0).setDepth(9000)
      .setStrokeStyle(4,0xf2b705).setInteractive({useHandCursor:true});
    this.head.on('pointerdown',()=>this.toggle());
    this.title=scene.add.text(22,17,'',{...f,fontSize:'16px',color:'#7c2d12',fontStyle:'bold'}).setScrollFactor(0).setDepth(9001);
    this.body=scene.add.container(12,40).setScrollFactor(0).setDepth(9000).setVisible(this.open);
    this.body.add(scene.add.rectangle(0,0,250,10+state.tasks.length*26,0xfff3a0,0.95).setOrigin(0).setStrokeStyle(4,0xf2b705));
    state.tasks.forEach((t,i)=>{
      const box=scene.add.text(10,6+i*26,'☐',{fontSize:'18px',color:'#333'});
      const txt=scene.add.text(34,7+i*26,'',{...f,fontSize:'14px',color:'#333',wordWrap:{width:205}});
      this.body.add([box,txt]); this.rows.push({task:t,box,txt,i,checked:state.done.has(t.id),glitchUntil:0,flipUntil:0});
    });
    this.onTask=id=>this.setStatus(id,true); state.on('task',this.onTask);
    scene.events.once('shutdown',()=>state.off('task',this.onTask));
    this.refresh();
  }
  toggle(){ this.open=!this.open; this.state.uiOpen=this.open; this.body.setVisible(this.open); this.refresh(); }
  setStatus(id,done){ const r=this.rows.find(r=>r.task.id===id); if(!r) return; r.checked=done; this.refresh();
    if(done&&this.state.corruptionLevel<0.5) this.starBurst(r.i); }
  refresh(){
    const c=this.state.corruptionLevel, now=this.scene.time.now; let done=0;
    this.rows.forEach(r=>{
      const bad=r.task.corruptText&&(c>=0.75||now<r.glitchUntil), shown=now<r.flipUntil?!r.checked:r.checked; if(r.checked) done++;
      r.txt.setText(bad?r.task.corruptText:`${r.task.icon} ${r.task.text}`); r.txt.setColor(bad&&c>0.7?'#991b1b':'#333'); r.box.setText(shown?'☑':'☐');
    });
    const n=this.rows.length, pend=this.rows.filter(r=>!r.checked).map(r=>r.task.icon).join('');
    this.title.setText(this.open?`📋 TASKS  ${done}/${n}   ▲`:`📋 TASKS  ${done}/${n}  ▼`);
  }
  starBurst(i){ const s=this.scene.add.text(40,this.open?46+i*26:26,'★',{fontSize:'28px',color:'#f59e0b'}).setScrollFactor(0).setDepth(9002);
    this.scene.tweens.add({targets:s,scale:3,alpha:0,duration:500,onComplete:()=>s.destroy()}); }
  update(time){
    const p=this.state.params, c=this.state.corruptionLevel, j=p.uiJitterAmount;
    this.rows.forEach(r=>{ r.txt.x=34+(j?Phaser.Math.FloatBetween(-j,j)*0.4:0); r.txt.y=r.box.y+1+(j?Phaser.Math.FloatBetween(-j,j)*0.4:0); });
    if(c>=0.4&&Math.random()<0.003*(1+c*3)){      // glitches are only VISUAL and always revert
      const r=Phaser.Utils.Array.GetRandom(this.rows);
      if(Math.random()<0.5) r.flipUntil=time+Phaser.Math.Between(700,1800); else r.glitchUntil=time+Phaser.Math.Between(600,2000);
      this.refresh(); this.scene.time.delayedCall(2000,()=>this.refresh());
    }
  }
}

/* ============================================================
   DIALOGUE BOX  (typewriter, blips, branching choices via 1 / 2)
   ============================================================ */
class Dialogue {
  constructor(sc,keys){
    this.sc=sc; this.k=keys; this.active=false; this.timer=null; this.choosing=false;
    this.c=sc.add.container(0,0).setScrollFactor(0).setDepth(9500).setVisible(false);
    this.bg=sc.add.rectangle(40,425,720,145,0xfff8dc,0.97).setOrigin(0).setStrokeStyle(5,0x92400e);
    this.nm=sc.add.text(58,435,'',{fontFamily:FONT,fontSize:'19px',fontStyle:'bold',color:'#c2410c'});
    this.tx=sc.add.text(58,466,'',{fontFamily:FONT,fontSize:'18px',color:'#222',wordWrap:{width:684},lineSpacing:4});
    this.hint=sc.add.text(750,562,'▼ E',{fontFamily:FONT,fontSize:'14px',color:'#92400e'}).setOrigin(1,1);
    this.c.add([this.bg,this.nm,this.tx,this.hint]);
  }
  open(lines,onEnd){
    this.q=[...lines]; this.onEnd=onEnd; this.active=true; this.c.setVisible(true);
    const bad=this.sc.state.phase===3; this.bg.setFillStyle(bad?0x1a0708:0xfff8dc,0.97).setStrokeStyle(5,bad?0x7f1d1d:0x92400e); this.tx.setColor(bad?'#ff5555':'#222');
    this.next();
  }
  next(){
    if(!this.q.length){ this.active=false; this.c.setVisible(false); if(this.onEnd) this.onEnd(); return; }
    const l=this.cur=this.q.shift(); this.nm.setText(l.who); this.full=l.text; this.i=0; this.choosing=false; this.hint.setVisible(true); this.tx.setText('');
    if(l.fx) this.sc.onFx(l.fx);
    if(this.timer) this.timer.remove();
    this.timer=this.sc.time.addEvent({delay:24,loop:true,callback:()=>{
      this.i++; this.tx.setText(this.full.slice(0,this.i)); if(this.i%2===0) this.sc.audio.sfx('blip'); if(this.i>=this.full.length) this.doneTyping(); }});
  }
  doneTyping(){
    if(this.timer){ this.timer.remove(); this.timer=null; } this.tx.setText(this.full);
    if(this.cur.ask){ this.choosing=true; this.tx.setText(this.full+'\n\n1) '+this.cur.ask[0]+'        2) '+this.cur.ask[1]); this.hint.setVisible(false); }
  }
  update(){
    const J=Phaser.Input.Keyboard.JustDown, k=this.k;
    this.tx.x=58+(this.sc.state.phase===3?Phaser.Math.FloatBetween(-1.5,1.5):0);
    if(this.timer){ if(J(k.E)||J(k.SP)) this.doneTyping(); return; }
    if(this.choosing){ if(J(k.N1)) this.pick(0); else if(J(k.N2)) this.pick(1); return; }
    if(J(k.E)||J(k.SP)) this.next();
  }
  pick(i){ this.q.unshift(...this.cur.then[i]); this.next(); }
}

class EscapeCutscene extends Phaser.Scene {

  addForest(g,night=1){

    g.fillStyle(night?0x101916:0x183024,1).fillRect(0,330,800,270);

    for(let i=0;i<15;i++){
      const x=-20+i*62+(i%2)*10, h=120+(i%5)*28;
      g.fillStyle(i%3===0?0x0b120f:0x111b16,1).fillRect(x,330-h,18,h+270);
      g.fillTriangle(x+9,330-h-75,x-55,330-h+55,x+73,330-h+55);
      g.fillTriangle(x+9,330-h-25,x-38,330-h+75,x+56,330-h+75);
    }
    // ground path
    g.fillStyle(0x262521,1).fillTriangle(300,600,370,350,430,350,500,600);
    g.fillStyle(0x34332e,1).fillTriangle(345,600,385,390,415,390,455,600);
    // moon
    g.fillStyle(0xd9d7b5,0.8).fillCircle(675,90,34);
    g.fillStyle(night?0x070a0d:0x101a18,0.8).fillCircle(690,82,30);
  }
  bobThirdPerson(x,y,scale=2,run=false,flip=false){
    const b=this.add.sprite(x,y,'bob_d_i0').setOrigin(.5,.96).setScale(scale).setDepth(20);
    b.play(run?'bob_walk_d':'bob_idle_d'); b.setFlipX(flip); return b;
  }
  figureThirdPerson(x,y,scale=1){
    const g=this.add.graphics().setDepth(18);
    g.fillStyle(0x050505,1).fillEllipse(x,y-42*scale,28*scale,50*scale);
    g.fillRect(x-13*scale,y-18*scale,26*scale,65*scale);
    g.fillRect(x-24*scale,y-8*scale,10*scale,55*scale).fillRect(x+14*scale,y-8*scale,10*scale,55*scale);
    g.fillStyle(0x17070a,1).fillEllipse(x,y-45*scale,9*scale,5*scale);
    return g;
  }
  sceneRun(){
    const g=this.add.graphics(); this.root.add(g); this.addForest(g);
    // cinematic side/behind view: Bob is visible running away from camera
    const bob=this.bobThirdPerson(400,510,2.5,true,false); this.root.add(bob);
    const dust=this.add.graphics().setDepth(19); this.root.add(dust);
    for(let i=0;i<8;i++) dust.fillStyle(0x77715f,0.18).fillCircle(380+i*6,555-(i%3)*8,4+(i%2)*3);
    this.tweens.add({targets:bob,x:{from:390,to:410},duration:240,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
    this.tweens.add({targets:bob,scaleX:{from:2.45,to:2.65},duration:180,yoyo:true,repeat:-1});
    this.text('RUN.','Bob tears through the woods, never looking back.');
  }
  sceneNoise(){
    const g=this.add.graphics(); this.root.add(g); this.addForest(g);
    const bob=this.bobThirdPerson(400,500,2.35,false,false); this.root.add(bob);
    // a branch bends/snaps behind Bob
    const br=this.add.graphics().setDepth(17); this.root.add(br);
    const drawBranch=(ang)=>{br.clear(); br.lineStyle(8,0x3b281d,1); br.beginPath(); br.moveTo(585,250); br.lineTo(540,330); br.lineTo(500,300); br.strokePath(); br.setRotation(ang);};
    drawBranch(0);
    this.tweens.add({targets:br,angle:{from:-.04,to:.08},duration:180,yoyo:true,repeat:4});
    this.audio&&this.audio.sfx('branch');
    this.text('...CRACK.','Bob freezes. Something moved behind him.');
  }
  sceneLookBack(){
    const g=this.add.graphics(); this.root.add(g); this.addForest(g);
    // Bob turns his body toward the sound; camera remains third-person
    const bob=this.bobThirdPerson(420,500,2.4,false,true); this.root.add(bob);
    const glow=this.add.circle(420,415,85,0x6d7c6b,0.08).setDepth(3); this.root.add(glow);
    this.tweens.add({targets:glow,alpha:0,duration:1200});
    this.text('Bob looks behind him.','Nothing. Just trees, fog, and the sound of his own breathing.');
  }
  sceneTurn(){
    const g=this.add.graphics(); this.root.add(g); this.addForest(g);
    const bob=this.bobThirdPerson(420,505,2.4,false,false); this.root.add(bob);
    this.figureThirdPerson(400,300,0.75);
    const fog=this.add.rectangle(400,390,520,130,0x9aa59a,0.06).setDepth(10); this.root.add(fog);
    this.text('He turns back around.','A figure is standing far down the path.');
    this.audio&&this.audio.sfx('heartbeat');
  }
  sceneFirstPerson(){
    const g=this.add.graphics(); this.root.add(g);
    g.fillStyle(0x030307,1).fillRect(0,0,800,600);
    g.fillStyle(0x0b1110,1).fillRect(0,350,800,250);
    for(let i=0;i<13;i++){
      const x=i*67, h=170+(i%4)*35;
      g.fillStyle(0x101714,1).fillRect(x,350-h,15,h+250);
      g.fillTriangle(x+7,350-h-70,x-58,350-h+55,x+70,350-h+55);
    }
    g.fillStyle(0x25241f,1).fillTriangle(265,600,400,395,535,600);
    // subtle first-person hands at bottom
    g.fillStyle(0x8b5a3c,1).fillRoundedRect(245,505,72,95,24).fillRoundedRect(483,505,72,95,24);
    g.fillStyle(0x2b2b2b,1).fillEllipse(281,540,62,38).fillEllipse(519,540,62,38);
    // distant figure
    const m=this.add.sprite(400,330,'monster').setScale(.16).setAlpha(.75).setDepth(20); this.root.add(m);
    this.caption.setY(525);
    this.text('WOAH... WHAT’S THA...','Bob squints. The figure is getting closer.');
    this.audio&&this.audio.sfx('heartbeat');
    this.tweens.add({targets:m,alpha:1,scale:.2,duration:900,yoyo:true,repeat:1});
  }
  text(title,body){
    this.caption.setText(title+'\n'+body).setAlpha(0);
    this.tweens.add({targets:this.caption,alpha:1,duration:500});
  }
  showSlide(i){
    if(this.finished) return; this.index=i; this.clearScene();
    const slides=[
      ['run',5200],['noise',4800],['look',5000],['turn',5200],['fp',3000]
    ];
    const s=slides[i]; if(!s) return this.animateFinal();
    if(s[0]==='run') this.sceneRun();
    if(s[0]==='noise') this.sceneNoise();
    if(s[0]==='look') this.sceneLookBack();
    if(s[0]==='turn') this.sceneTurn();
    if(s[0]==='fp') this.sceneFirstPerson();
    this.time.delayedCall(s[1],()=>this.showSlide(i+1));
  }
  animateFinal(){
    this.clearScene(); this.caption.setText('');
    const g=this.add.graphics().setDepth(2); g.fillStyle(0x020204,1).fillRect(0,0,800,600); g.fillStyle(0x0b100e,1).fillRect(0,360,800,240);
    for(let i=0;i<11;i++){const x=i*76;g.fillStyle(0x0b110f,1).fillRect(x,220,16,380);g.fillTriangle(x+8,160,x-55,325,x+70,325);}
    const monster=this.add.sprite(400,330,'monster').setScale(.18).setDepth(10);
    this.audio&&this.audio.sfx('heartbeat');
    this.tweens.add({targets:monster,scale:.26,duration:700,ease:'Sine.easeIn'});
    this.time.delayedCall(1000,()=>{
      this.audio&&this.audio.sfx('scream');
      const red=this.add.rectangle(400,300,800,600,0xb00000,.18).setDepth(30);
      this.tweens.add({targets:red,alpha:.78,duration:70,yoyo:true,repeat:12});
      this.cameras.main.shake(1000,.055); monster.setAlpha(1);
      this.tweens.add({targets:monster,scale:9.5,y:310,duration:430,ease:'Cubic.easeIn',onUpdate:()=>this.cameras.main.shake(80,.035),onComplete:()=>this.jumpscare()});
    });
  }
  jumpscare(){
    if(this.finished) return; this.finished=true;
    this.audio&&this.audio.sfx('scream'); this.cameras.main.flash(140,255,255,255);
    const red=this.add.rectangle(400,300,800,600,0xa00000,.82).setDepth(40);
    this.tweens.add({targets:red,alpha:.45,duration:80,yoyo:true,repeat:7});
    this.add.text(400,300,'YOU SHOULD NOT HAVE LOOKED.',{fontFamily:'Georgia, serif',fontSize:'36px',color:'#ffdddd',stroke:'#300000',strokeThickness:8,align:'center',wordWrap:{width:720}}).setOrigin(.5).setDepth(42);
    this.time.delayedCall(1900,()=>this.scene.start('End'));
  }
}

class WorldMapUI {
  constructor(scene,state){
    this.scene=scene; this.state=state; this.open=false;
    this.c=scene.add.container(0,0).setScrollFactor(0).setDepth(9900).setVisible(false);
    this.bg=scene.add.rectangle(400,300,720,500,0x172033,0.97).setStrokeStyle(5,0xfacc15);
    this.title=scene.add.text(400,55,'🗺️ TOWN MAP',{fontFamily:FONT,fontSize:'30px',fontStyle:'bold',color:'#fde68a'}).setOrigin(.5);
    this.hint=scene.add.text(400,535,'Click an area to travel  •  M / ESC to close',{fontFamily:FONT,fontSize:'15px',color:'#e5e7eb'}).setOrigin(.5);
    this.c.add([this.bg,this.title,this.hint]);
    this.buttons=[];
    const areas=[
      ['town','🏘️ Town',400,145],['field','🌻 Sunflower Field',220,235],['market','🛒 Market Square',580,235],
      ['riverside','🌊 Quiet Riverside',220,355],['orchard','🍎 Old Orchard',580,355],['mill','⚙️ Old Mill',400,455]
    ];
    areas.forEach(([id,label,x,y])=>{
      const r=scene.add.rectangle(x,y,220,62,0xfef3c7,1).setStrokeStyle(3,0xd97706).setInteractive({useHandCursor:true});
      const t=scene.add.text(x,y,label,{fontFamily:FONT,fontSize:'17px',fontStyle:'bold',color:'#7c2d12',align:'center',wordWrap:{width:200}}).setOrigin(.5);
      r.on('pointerover',()=>r.setFillStyle(0xfde68a)); r.on('pointerout',()=>r.setFillStyle(0xfef3c7));
      r.on('pointerdown',()=>this.travel(id)); this.c.add([r,t]); this.buttons.push({id,r,t});
    });
    const close=scene.add.text(750,55,'✕',{fontFamily:FONT,fontSize:'26px',color:'#fff',backgroundColor:'#7f1d1d',padding:{x:8,y:3}}).setOrigin(.5).setInteractive({useHandCursor:true});
    close.on('pointerdown',()=>this.toggle(false)); this.c.add(close);
  }
  toggle(force){ this.open=force===undefined?!this.open:force; this.c.setVisible(this.open); if(this.open){ this.refresh(); } }
  refresh(){ this.buttons.forEach(b=>{ const here=b.id===this.scene.roomId; b.r.setFillStyle(here?0xfacc15:0xfef3c7); b.t.setText(`${here?'📍 ':''}${b.t.text.replace(/^📍 /,'')}`); }); }
  travel(id){
    if(!this.open||id===this.scene.roomId) return this.toggle(false);
    const spawns={town:[12,10],field:[2.2,9.9],market:[2,10],riverside:[2,10],orchard:[2,10],mill:[2,10]};
    this.toggle(false); this.scene.audio.sfx('door'); this.scene.goTo(id,spawns[id]||[12,10]);
  }
  update(){}
}

class RoomScene extends Phaser.Scene {
  constructor(){ super('Room'); }
  init(d){ this.roomId=d.room||'town'; this.spawn=d.spawn||[12,10]; this.state=this.registry.get('state'); this.audio=this.registry.get('audio'); }

  create(){
    const st=this.state, R=ROOMS[this.roomId], W=R.w*T, H=R.h*T;
    this.ox=Math.max(0,(800-W)/2); this.oy=Math.max(0,(600-H)/2);
    const P=(x,y)=>[this.ox+x*T,this.oy+y*T];
    this.blocks=[]; this.sunflowers=[]; this.spr={}; this.busy=false; this.acting=false; this.act=null; this.born=this.time.now; this.grace=0; this.hm=null; this.houseWarned=false;
    this.mayorMonster=st.mayorMonster; this.beatT=0; this.pillFlash=0;
    this.nextVoice=Phaser.Math.Between(6000,12000);
    this.cameras.main.setBackgroundColor(R.bg).fadeIn(400);

    const data=[]; for(let y=0;y<R.h;y++){ const row=[]; for(let x=0;x<R.w;x++) row.push(R.tile(x,y)); data.push(row); }
    const map=this.make.tilemap({data,tileWidth:T,tileHeight:T});
    this.layer=map.createLayer(0,map.addTilesetImage('tiles','tiles',T,T,0,0),this.ox,this.oy); this.layer.setCollision([2,4]);
    this.drawPaths(R);

    const place=p=>{
      const [x,y]=P(p.x,p.y);
      if(p.k){ const s=this.add.image(x,y,p.k).setOrigin(.5,1).setDepth(y); this.spr[p.k]=s;
        if(p.sway) this.tweens.add({targets:s,angle:{from:-2.5,to:2.5},duration:Phaser.Math.Between(1300,2300),delay:Math.random()*900,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
        if(p.sf) this.sunflowers.push(s); }
      if(p.b){ const r=this.add.rectangle(x,y-p.b[1]/2,p.b[0],p.b[1]).setVisible(false); this.physics.add.existing(r,true); this.blocks.push(r); }
      return [x,y];
    };
    R.props.forEach(place);
    this.triggers=R.triggers.map(d=>{
      const t={...d};
      if(d.npc){ [t.x,t.y]=P(d.x,d.y); t.sprite=this.add.sprite(t.x,t.y,'mayor_i0').setOrigin(.5,.96).play('mayor_idle'); }
      else [t.x,t.y]=place(d);
      if(d.icon){ t.iconObj=this.add.text(t.x,t.y-(d.ih||44),d.icon,{fontSize:'22px'}).setOrigin(.5).setDepth(8000);
        if(!d.npc) this.tweens.add({targets:t.iconObj,y:t.iconObj.y-6,duration:600,yoyo:true,repeat:-1,ease:'Sine.easeInOut'}); }
      return t;
    });
    this.mayor=this.triggers.find(t=>t.npc);
    if(this.mayor) this.styleMayor();

    // slow-burn set dressing
    if(st.day>=2&&this.sunflowers[0]) this.sunflowers[0].setTint(0x8a8a5a).setScale(1,0.8);
    if(st.day>=4) this.sunflowers.forEach((s,i)=>{ if(i%2) s.setTint(0x9a9a6a); });
    if(st.day>=6){ if(this.spr.pond) this.spr.pond.setTint(0x7a1010); if(this.spr.scarecrow) this.spr.scarecrow.setTint(0x991b1b); }

    const [sx,sy]=P(...this.spawn);
    this.player=this.physics.add.sprite(sx,sy,'bob_d_i0').setOrigin(.5,.96).play('bob_idle_d');
    this.player.body.setSize(14,10).setOffset(9,40); this.player.setCollideWorldBounds(true); this.facing='d';
    this.physics.world.setBounds(this.ox,this.oy,W,H);
    this.physics.add.collider(this.player,this.layer); this.physics.add.collider(this.player,this.blocks);
    this.cameras.main.setBounds(0,0,Math.max(800,W),Math.max(600,H)).startFollow(this.player,true,0.15,0.15);

    this.cursors=this.input.keyboard.createCursorKeys(); this.wasd=this.input.keyboard.addKeys('W,A,S,D');
    this.keys=this.input.keyboard.addKeys({E:'E',SP:'SPACE',N1:'ONE',N2:'TWO',Q:'Q',T:'T',M:'M',ESC:'ESC'});
    this.inverted=false;
    this.time.addEvent({delay:1500,loop:true,callback:()=>{ this.inverted=Math.random()<this.state.params.controlInvertChance; }});

    this.checklist=new ChecklistUI(this,st); this.mapUI=new WorldMapUI(this,st); this.dlg=new Dialogue(this,this.keys);
    this.prompt=this.add.text(0,0,'',{fontSize:'14px',color:'#fff',backgroundColor:'#000a',padding:{x:5,y:3}}).setDepth(8500).setVisible(false).setOrigin(.5);
    const hud=(x,y,txt,sz,ox=1)=>this.add.text(x,y,txt,{fontFamily:FONT,fontSize:sz,color:'#fff',stroke:'#000',strokeThickness:4}).setScrollFactor(0).setDepth(9000).setOrigin(ox,0);
    hud(788,10,`Day ${st.day}`,'22px'); hud(788,38,R.name,'14px'); hud(788,58,'🧠 SANITY','12px');
    this.pillText=hud(788,96,'','13px');
    hud(400,592,'Move: Arrows/WASD   Interact: E   Pill: Q   Tasks: T / click   Map: M / button',' 12px',.5).setOrigin(.5,1);
    this.bars=this.add.graphics().setScrollFactor(0).setDepth(9000); this.actBar=this.add.graphics().setDepth(8600);

    this.grade=this.add.rectangle(0,0,800,600,0x8a9a6a).setOrigin(0).setScrollFactor(0).setDepth(8800).setBlendMode(Phaser.BlendModes.MULTIPLY);
    this.vignette=this.add.image(0,0,'vignette').setOrigin(0).setScrollFactor(0).setDepth(8801);
    this.dark=this.add.rectangle(0,0,800,600,0x000000).setOrigin(0).setScrollFactor(0).setDepth(8802);
    this.noise=this.add.rectangle(0,0,800,600,0xffffff).setOrigin(0).setScrollFactor(0).setDepth(8803).setAlpha(0);

    // house monster timer: none on Days 1-2, shadow on 3-5, real monster 6-7
    this.houseLimit=this.roomId==='house'&&st.day>=3?(st.phase===3?25000:42000):0;
  }

  drawPaths(R){
    const g=this.add.graphics().setDepth(6);
    const px=(x,y,w,h,color=0xf0d58a)=>{g.fillStyle(color,1).fillRect(this.ox+x*T,this.oy+y*T,w*T,h*T);};
    if(['town','field','market','riverside','orchard','mill'].includes(this.roomId)){
      px(1,9,23,1.8); // main east-west path
      if(this.roomId==='town'){ px(10,9,1.2,8); px(10,16.2,3,1.8); } // market path
      if(this.roomId==='field'){ px(12,9,1.2,8); px(22,9,1.2,8); px(12,16,3,1.8); px(22,16,3,1.8); }
      if(this.roomId==='riverside'){ px(23,9,2,1.8); px(23,7,1.2,5); }
      if(this.roomId==='orchard'){ px(12,7,1.2,3); px(19,10,1.2,5); }
      if(this.roomId==='mill'){ px(15,9,1.2,6); px(15,14,5,1.8); }
    }
    g.setAlpha(.72);
  }

  styleMayor(){
    const s=this.mayor.sprite, d=this.state.day;
    if(this.mayorMonster) this.makeMonster(); else if(d>=5) s.setScale(0.95,1.12); else if(d>=3) s.setScale(1,1.04);
  }
  makeMonster(){ const s=this.mayor.sprite; s.stop(); s.setTexture('monster').setScale(1).setRotation(0);
    this.tweens.add({targets:s,scaleY:1.06,duration:500,yoyo:true,repeat:-1}); }
  onFx(fx){ if(fx==='monster'){ this.state.mayorMonster=this.mayorMonster=true; this.makeMonster(); this.audio.sfx('roar'); this.cameras.main.shake(700,0.02); this.cameras.main.flash(400,255,0,0); } }

  /* ---------- helpers ---------- */
  goTo(room,spawn,onMid){
    if(this.busy) return; this.busy=true; this.player.setVelocity(0); this.cameras.main.fadeOut(350,0,0,0);
    this.cameras.main.once('camerafadeoutcomplete',()=>{ if(onMid) onMid(); this.scene.restart({room,spawn}); });
  }
  flash(msg){ const t=this.add.text(this.player.x,this.player.y-60,msg,{fontSize:'15px',color:'#fff',stroke:'#000',strokeThickness:3}).setOrigin(.5).setDepth(8600);
    this.tweens.add({targets:t,y:t.y-24,alpha:0,duration:1000,onComplete:()=>t.destroy()}); }
  voice(txt){
    const big=this.state.phase===3;
    const t=this.add.text(400,big?290:490,txt,{fontFamily:'Georgia, serif',fontSize:big?'34px':'22px',fontStyle:'italic',color:big?'#ff2a2a':'#d8d8e8',stroke:'#000',strokeThickness:5,align:'center',wordWrap:{width:700}})
      .setOrigin(.5).setScrollFactor(0).setDepth(9400).setAlpha(0);
    this.audio.sfx('whisper'); if(big&&Math.random()<0.4) this.audio.sfx('sting');
    this.tweens.add({targets:t,alpha:big?1:0.85,duration:900,yoyo:true,hold:big?1800:1500,onComplete:()=>t.destroy()});
    if(big) this.tweens.add({targets:t,x:{from:394,to:406},duration:60,yoyo:true,repeat:45});
  }
  takePill(){
    const st=this.state, now=performance.now();
    if(now<st.pillReadyAt) return this.flash(`Wait ${Math.ceil((st.pillReadyAt-now)/1000)}s`);
    st.pillReadyAt=now+15000; st.addSanity(22); this.audio.sfx('pill'); this.flash('💊 Sanity +22');
  }
  finish(task){
    if(!this.state.completeTask(task.id)) return;
    this.audio.sfx('success'); this.flash(['Yay!','Done.','...'][this.state.phase-1]);
    if(this.state.phase===3&&Math.random()<0.4) this.voice(Phaser.Utils.Array.GetRandom(VOICE_SEVERE));
  }

  /* ---------- interaction ---------- */
  interact(t){
    const st=this.state, task=st.tasks.find(k=>k.trigger===t.id&&!st.done.has(k.id));
    if(t.type==='door'){ this.audio.sfx('door'); return this.goTo(t.to,t.spawn); }
    if(t.type==='bed'){
      if(!st.allDone()) return this.flash('Still things to do!');
      if(st.day>=7){ this.busy=true; this.cameras.main.fadeOut(1200,0,0,0); return this.cameras.main.once('camerafadeoutcomplete',()=>this.scene.start('End')); }
      return this.goTo('house',[7,7.2],()=>st.nextDay());
    }
    if(t.id==='mayor'){
      // Talking to Barnaby must NEVER advance the day or clear the checklist.
      // Snapshot the completed task IDs so dialogue cannot accidentally reset progress.
      const completedBeforeTalk=new Set(st.done);
      this.dlg.open(MAYOR_TALK[st.day],()=>{
        completedBeforeTalk.forEach(id=>st.done.add(id));
        if(task) this.finish(task);
        this.grace=this.time.now+3500;
        this.checklist.refresh();
      });
      return;
    }
    if(t.id==='board'){
      this.dlg.open([{who:'📋 Notice Board',text:BOARD[st.phase-1]}],()=>{ if(task) this.finish(task); }); return;
    }
    if(t.type==='explore'){
      this.startExplore(t);
      return;
    }
    if(t.id==='basket'){                       // only 1 in 4 apples is good
      return this.startAction(t,()=>{
        const good=Math.random()<0.25; this.audio.sfx('crunch'); this.audio.sfx(good?'good':'bad');
        st.addSanity(good?12:-10); this.flash(good?'🍎 Sweet! Sanity +12':'🍎 Rotten... Sanity -10');
        if(task) this.finish(task);
      });
    }
    if(task) return this.startAction(t,()=>this.finish(task));
    this.flash('Nothing to do here.');
  }

  startExplore(t){
    if(this.busy||this.acting) return;
    this.acting=true; this.player.setVelocity(0);
    const oldScale=this.player.scale;
    this.tweens.add({targets:this.player,scale:oldScale*1.12,duration:180,yoyo:true,ease:'Sine.easeInOut'});
    const pulse=this.add.circle(t.x,t.y,10,0xfacc15,0.35).setDepth(8700);
    this.tweens.add({targets:pulse,scale:4,alpha:0,duration:850,onComplete:()=>pulse.destroy()});
    const msg={
      marketFountain:'The fountain is older than the town records.',
      marketStallA:'Someone left a warm loaf here. Nobody is around.',
      marketStallB:'The flowers are tied with tiny yellow ribbons.',
      river:'The river sounds almost like someone humming.',
      bridge:'The bridge is sturdy. For now.',
      orchardTrees:'The oldest trees have names carved into them.',
      orchardPath:'The path disappears behind the trees.',
      millWheel:'The mill wheel is turning, but there is no wind.',
      millCreek:'The creek carries little paper boats downstream.'
    }[t.id]||'You found something interesting.';
    this.flash(msg);
    this.audio.sfx('good');
    const task=this.state.tasks.find(k=>k.trigger===t.id&&!this.state.done.has(k.id));
    if(task) this.finish(task);
    this.time.delayedCall(850,()=>{this.acting=false;});
  }

  /* ---------- task animations: Bob works for a moment, effects play, then the task completes ---------- */
  fxText(e,x,y,size='22px'){ return this.add.text(x,y,e,{fontSize:size}).setOrigin(.5).setDepth(8700); }
  startAction(t,onDone){
    const a=ACTIONS[t.id]; if(!a) return onDone();
    const bloody=this.state.phase===3&&a.kind!=='throw'&&a.kind!=='sweep', e=bloody?'🩸':a.e, R=Phaser.Math.Between, px=this.player.x, py=this.player.y;
    this.acting=true; this.player.setVelocity(0); this.act={t0:this.time.now,ms:a.ms};
    const dx=t.x-px; if(Math.abs(dx)>10){ this.facing='s'; this.player.setFlipX(dx<0); } else this.facing=t.y<py?'u':'d';
    const work=this.tweens.add({targets:this.player,scaleY:0.9,scaleX:1.06,angle:{from:-2,to:2},duration:130,yoyo:true,repeat:-1});
    const junk=[], target=this.spr[t.k]||t.sprite;
    if(a.kind==='sweep'){ const br=this.fxText('🧹',t.x-16,t.y-22,'26px'); junk.push(br);
      this.tweens.add({targets:br,angle:{from:-35,to:35},duration:170,yoyo:true,repeat:-1});
      if(target) this.tweens.add({targets:target,angle:{from:-6,to:6},duration:120,yoyo:true,repeat:-1}); }
    const spark=()=>{
      if(a.kind==='throw'){ const s=this.fxText(e,px,py-30,'24px');
        this.tweens.add({targets:s,x:t.x,duration:a.ms*0.6,ease:'Sine.easeInOut'});
        this.tweens.add({targets:s,y:t.y-24,angle:360,duration:a.ms*0.6,ease:'Back.easeIn',onComplete:()=>{ s.destroy(); this.tweens.add({targets:target||this.player,angle:{from:-8,to:8},duration:70,yoyo:true,repeat:3}); }}); }
      else if(a.kind==='rain'){ const s=this.fxText(e,t.x+R(-46,46),t.y-84); this.tweens.add({targets:s,y:s.y+58,alpha:0,duration:520,onComplete:()=>s.destroy()}); }
      else if(a.kind==='scatter'){ const s=this.fxText(e,px,py-26,'18px'), x=t.x+R(-34,34), y=t.y-R(2,20);
        this.tweens.add({targets:s,x,y,angle:180,duration:420,onComplete:()=>{ s.destroy();
          const r=this.add.ellipse(x,y,6,3).setStrokeStyle(2,bloody?0x7a1010:0xffffff).setFillStyle(0xffffff,0).setDepth(8700);
          this.tweens.add({targets:r,scale:6,alpha:0,duration:600,onComplete:()=>r.destroy()}); }}); }
      else if(a.kind==='rise'){ const s=this.fxText(e,t.x+R(-16,16),t.y-36); this.tweens.add({targets:s,y:s.y-46,alpha:0,scale:1.5,duration:850,onComplete:()=>s.destroy()}); }
      else if(a.kind==='sweep'){ const s=this.fxText('✨',t.x+R(-24,24),t.y-R(10,60),'16px'); this.tweens.add({targets:s,y:s.y-20,alpha:0,duration:600,onComplete:()=>s.destroy()}); }
    };
    spark(); const ev=this.time.addEvent({delay:a.kind==='throw'?99999:150,loop:true,callback:spark});
    this.time.delayedCall(a.ms,()=>{
      work.remove(); ev.remove(); junk.forEach(o=>o.destroy()); if(target) target.setAngle(0);
      this.player.setScale(1); this.player.setAngle(0); this.acting=false; this.act=null; if(this.busy) return;
      for(let i=0;i<7;i++){ const s=this.fxText(bloody?'🩸':'⭐',t.x,t.y-30,'18px'), an=i/7*Math.PI*2;
        this.tweens.add({targets:s,x:t.x+Math.cos(an)*36,y:t.y-30+Math.sin(an)*36,alpha:0,duration:650,onComplete:()=>s.destroy()}); }
      onDone();
    });
  }
  drawAct(time){
    const g=this.actBar; g.clear(); if(!this.act) return;
    const f=Math.min(1,(time-this.act.t0)/this.act.ms), x=this.player.x-22, y=this.player.y-64;
    g.fillStyle(0x000000,0.65).fillRoundedRect(x-2,y-2,48,10,4); g.fillStyle(this.state.phase===3?0xef4444:0xfacc15,1).fillRoundedRect(x,y,44*f,6,3);
  }

  /* ---------- horror events ---------- */
  spawnHouseMonster(){
    const st=this.state, big=st.phase===3, [x,y]=[this.ox+3*T,this.oy+4.5*T];
    this.hm=this.add.sprite(x,y,big?'monster':'shadow').setOrigin(.5,.96).setDepth(y);
    this.audio.sfx(big?'roar':'creak'); this.cameras.main.shake(500,0.012);
    this.voice(big?'IT FOUND YOU.':'Something is in the house.');
  }
  triggerEscapeCutscene(){
    if(this.busy || this.scene.isActive('EscapeCutscene')) return;
    this.busy=true; this.player.setVelocity(0); this.scene.start('EscapeCutscene');
  }
  forceOut(){
    this.audio.sfx('sting'); this.cameras.main.flash(300,255,255,255);
    this.triggerEscapeCutscene();
  }

  /* ---------- main loop ---------- */
  applyParams(){
    const p=this.state.params;
    this.grade.setAlpha(p.desaturation); this.vignette.setAlpha(Math.min(1,p.desaturation*1.2)); this.dark.setAlpha(p.lightingDarkness*0.6);
  }
  drawHud(){
    const st=this.state, s=st.sanity/100, low=s<0.3, jx=low?Phaser.Math.FloatBetween(-1.5,1.5):0, g=this.bars;
    g.clear(); g.fillStyle(0x000000,0.65).fillRoundedRect(624,72,168,20,6);
    g.fillStyle(s>0.5?0x4ade80:s>0.25?0xfacc15:0xef4444,1).fillRoundedRect(628+jx,76,160*s,12,4);
    const now=performance.now(), rem=st.pillReadyAt-now;
    this.pillText.setText(rem>0?`💊 ${Math.ceil(rem/1000)}s`:'💊 Ready [Q]').setColor(rem>0?'#f87171':'#86efac');
    if(rem>0){ g.fillStyle(0x000000,0.65).fillRoundedRect(690,114,102,8,3); g.fillStyle(0xa78bfa,1).fillRoundedRect(690,114,102*(1-rem/15000),8,3); }
  }
  update(time,delta){
    const st=this.state, p=st.params, dt=delta/1000;
    this.applyParams(); this.drawHud(); this.checklist.update(time); this.drawAct(time);
    if(this.dlg.active){ this.player.setVelocity(0); this.animate(0,0); this.dlg.update(); return; }
    this.mapUI.update();
    if(this.mapUI.open){ this.player.setVelocity(0); this.animate(0,0); return; }

    // sanity drain, low-sanity effects
    if(!this.busy){
      st.sanity=Math.max(0,st.sanity-DRAIN[st.day-1]*dt);
      if(st.sanity<=0){ this.flash('Bob blacks out...'); this.triggerEscapeCutscene(); }
    }
    if(st.sanity<30&&(this.beatT-=delta)<=0){ this.beatT=1000; this.audio.sfx('beat'); if(st.sanity<15) this.cameras.main.shake(120,0.003); }
    if(Phaser.Input.Keyboard.JustDown(this.keys.Q)&&!this.busy) this.takePill();
    if(Phaser.Input.Keyboard.JustDown(this.keys.T)) this.checklist.toggle();
    if(Phaser.Input.Keyboard.JustDown(this.keys.M)) this.mapUI.toggle();
    if(Phaser.Input.Keyboard.JustDown(this.keys.ESC)&&this.mapUI.open) this.mapUI.toggle(false);

    // voices in Bob's head (Days 3+; much more frequent and vicious after Day 5)
    if(st.phase>=2&&!this.busy&&(this.nextVoice-=delta)<=0){
      this.voice(Phaser.Utils.Array.GetRandom(st.phase===3?VOICE_SEVERE:VOICE_MILD));
      this.nextVoice=(st.phase===3?Phaser.Math.Between(7000,14000):Phaser.Math.Between(18000,32000))*(0.6+0.4*st.sanity/100);
    }

    // movement
    const k=this.cursors, w=this.wasd, sp=140;
    let vx=(k.right.isDown||w.D.isDown?1:0)-(k.left.isDown||w.A.isDown?1:0), vy=(k.down.isDown||w.S.isDown?1:0)-(k.up.isDown||w.W.isDown?1:0);
    if(this.inverted){ vx=-vx; vy=-vy; } if(this.busy||this.acting){ vx=vy=0; }
    this.player.setVelocity(vx*sp,vy*sp); if(vx&&vy) this.player.body.velocity.normalize().scale(sp);
    this.animate(vx,vy);

    this.triggers.forEach(t=>{ if(t.iconObj&&t.type==='task') t.iconObj.setVisible(st.tasks.some(k=>k.trigger===t.id&&!st.done.has(k.id))); });

    // nearest trigger / auto doors
    let near=null,best=46;
    for(const t of this.triggers){
      const d=D(this.player.x,this.player.y,t.x,t.y);
      if(t.auto&&d<30&&time-this.born>700&&!this.busy&&!this.acting) return this.interact(t);
      if(!t.auto&&d<best){ best=d; near=t; }
    }
    this.prompt.setVisible(!!near&&!this.busy&&!this.acting);
    if(near){ this.prompt.setPosition(near.x,near.y-(near.ih||34)-22).setText('[E] '+near.label);
      if(Phaser.Input.Keyboard.JustDown(this.keys.E)&&!this.busy&&!this.acting) this.interact(near); }

    // Mayor: Day 5 creeps toward you; once transformed he hunts you
    if(this.mayor){
      const m=this.mayor, d=D(m.x,m.y,this.player.x,this.player.y), ang=Phaser.Math.Angle.Between(m.x,m.y,this.player.x,this.player.y);
      let spd=0; if(this.mayorMonster) spd=st.day===6?60:92; else if(p.npcFollowSpeed>0) spd=Math.min(p.npcFollowSpeed,30);
      if(!this.busy&&spd&&d>(this.mayorMonster?20:70)){ m.x+=Math.cos(ang)*spd*dt; m.y+=Math.sin(ang)*spd*dt; m.sprite.setPosition(m.x,m.y); }
      if(this.mayorMonster) m.sprite.setFlipX(this.player.x<m.x); else if(p.desaturation>0.5) m.sprite.rotation=ang+Math.PI/2;
      m.sprite.setDepth(m.y); if(m.iconObj) m.iconObj.setPosition(m.x,m.y-m.ih+Math.sin(time/250)*4);
      if(this.mayorMonster&&!this.busy&&d<30&&time>this.grace){
        this.triggerEscapeCutscene(); }
    }
    if(this.spr.scarecrow&&p.desaturation>0.35) this.spr.scarecrow.setAngle(Phaser.Math.Clamp((this.player.x-this.spr.scarecrow.x)/8,-14,14));

    // house monster: spawns if you linger, forces you out
    if(this.houseLimit&&!this.hm){
      if(!this.houseWarned&&time-this.born>this.houseLimit*0.7){ this.houseWarned=true; this.audio.sfx('creak'); this.voice("You've been here too long."); }
      if(time-this.born>this.houseLimit) this.spawnHouseMonster();
    }
    if(this.hm&&!this.busy){
      const h=this.hm, a=Phaser.Math.Angle.Between(h.x,h.y,this.player.x,this.player.y), s=(st.phase===3?105:70)*dt;
      h.x+=Math.cos(a)*s; h.y+=Math.sin(a)*s; h.setDepth(h.y).setFlipX(this.player.x<h.x);
      if(D(h.x,h.y,this.player.x,this.player.y)<28) this.forceOut();
    }

    // visual noise
    this.noise.setAlpha(p.phase===3?Phaser.Math.FloatBetween(0,0.06):0);
    if(p.phase>=2) this.dark.setAlpha(p.lightingDarkness*0.6*(Math.random()<0.02?1.5:1));
  }
  animate(vx,vy){
    if(vx||vy){ this.facing=Math.abs(vx)>=Math.abs(vy)?'s':(vy>0?'d':'u'); if(vx) this.player.setFlipX(vx<0); }
    if(this.facing!=='s') this.player.setFlipX(false);
    const key=`bob_${vx||vy?'walk':'idle'}_${this.facing}`;
    if(this.player.anims.currentAnim?.key!==key) this.player.play(key);
    this.player.setDepth(this.player.y);
  }
}

/* ============================================================ BOOT */
const state=new CorruptionManager();
const game=new Phaser.Game({
  type:Phaser.AUTO,width:800,height:600,backgroundColor:'#87ceeb',physics:{default:'arcade'},scene:[TitleScene,RoomScene,EscapeCutscene,EndScene],
  callbacks:{preBoot:g=>{ g.registry.set('state',state); g.registry.set('audio',new Sound(state)); }},
});
// Debug: hold SHIFT + 1-7 to jump to a day (plain 1/2 are reserved for dialogue choices)
window.addEventListener('keydown',e=>{
  const m=/^Digit([1-7])$/.exec(e.code);
  if(m&&e.shiftKey&&game.scene.isActive('Room')){
    state.day=+m[1]; state.done.clear(); state.sanity=100; state.mayorMonster=state.day>=7;
    game.scene.getScene('Room').scene.restart({room:'town',spawn:[12,10]});
  }
  if((e.key==='-'||e.code==='Minus')&&game.scene.isActive('Room')){
    state.day=10; state.done.clear(); state.sanity=100; state.mayorMonster=true;
    game.scene.getScene('Room').scene.restart({room:'town',spawn:[12,10]});
  }
});
</script>
