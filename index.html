/* ============================================================
   CORRUPTION MANAGER
   ============================================================ */
class CorruptionManager extends Phaser.Events.EventEmitter {
  constructor(){ super(); this.day=1; this.done=new Set(); this.sanity=100; this.pillReadyAt=0; this.mayorMonster=false; this.talked={}; this.uiOpen=false; }
  get tasks(){ return DAYS[this.day]; }
  get progress(){ return this.done.size/this.tasks.length; }
  get phase(){ const d=this.day; return d<=2?1:d<=4?2:d<=7?3:4; }
  get corruptionLevel(){ const c=LEVELS[this.day-1]+this.progress*0.05+(1-this.sanity/100)*0.2; return Math.min(CAPS[this.phase-1],c); }
  get params(){
    const c=this.corruptionLevel, lerp=Phaser.Math.Linear;
    return {musicPitch:lerp(1,0.6,c),uiJitterAmount:c<0.3?0:lerp(0,6,c),npcFollowSpeed:c<0.35?0:lerp(0,90,(c-0.35)/0.65),lightingDarkness:lerp(0,0.8,c),desaturation:c,
      controlInvertChance:this.day>=8?0.2:this.day>=6?0.08:0,phase:this.phase};
  }
  addSanity(d){ this.sanity=Phaser.Math.Clamp(this.sanity+d,0,100); }
  completeTask(id){ if(this.done.has(id)) return false; this.done.add(id); this.emit('task',id); return true; }
  allDone(){ return this.done.size>=this.tasks.length; }
  resetDay(){ this.done.clear(); this.talked={}; this.mayorMonster=this.day>=8; }
  nextDay(){ this.day=Math.min(10,this.day+1); this.sanity=Math.min(100,this.sanity+35); this.resetDay(); }
}

/* ============================================================
   SOUND (all synthesized)
   ============================================================ */
class Sound {
  constructor(state){ this.state=state; this.ctx=null; this.step=0; this.pos=3; }
  start(){
    if(this.ctx) return; const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const c=this.ctx=new C(); this.out=c.createGain(); this.out.gain.value=0.5; this.out.connect(c.destination);
    this.mel=c.createBiquadFilter(); this.mel.type='lowpass'; this.mel.connect(this.out);
    const lp=c.createBiquadFilter(); lp.frequency.value=180; lp.connect(this.out);
    this.dg=c.createGain(); this.dg.gain.value=0; this.dg.connect(lp);
    [55,55.9].forEach(f=>{ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.connect(this.dg); o.start(); });
    this.loop();
  }
  tone(f,d,type='sine',v=0.2,to=null,dest=null,when=0){
    const c=this.ctx; if(!c) return; const t=c.currentTime+when, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(dest||this.out); o.start(t); o.stop(t+d+0.05);
  }
  noise(d,v=0.2,f=1000,q=1,type='bandpass'){
    const c=this.ctx; if(!c) return; const n=(c.sampleRate*d)|0, b=c.createBuffer(1,n,c.sampleRate), a=b.getChannelData(0);
    for(let i=0;i<n;i++) a[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=b; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    const g=c.createGain(), t=c.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+d*0.3); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl); fl.connect(g); g.connect(this.out); s.start();
  }
  loop(){
    const st=this.state, c=st.corruptionLevel;
    this.mel.frequency.value=7000-6200*c; this.dg.gain.value=c*c*0.14;
    const scale=[0,2,4,7,9,12,14,16]; this.step++; this.pos=Phaser.Math.Clamp(this.pos+Phaser.Math.Between(-2,2),0,7);
    if(!(c>0.45&&Math.random()<c-0.35)){ let semi=scale[this.pos]; if(c>0.5&&Math.random()<c) semi+=1; this.tone(261.6*Math.pow(2,(semi+(Math.random()-.5)*c*4)/12),0.5,'triangle',0.16,null,this.mel); }
    if(st.day===1&&this.step%4===0) this.tone(130.8,0.6,'sine',0.15);
    setTimeout(()=>this.loop(),260+520*c);
  }
  sfx(n){
    if(!this.ctx) return; const c=this.state.corruptionLevel;
    switch(n){
      case 'success': if(c<0.55) [523,659,784].forEach((f,i)=>this.tone(f,0.25,'sine',0.18,null,null,i*0.08)); else { this.tone(180,0.5,'sawtooth',0.15,60); this.noise(0.4,0.2,900); } break;
      case 'blip': this.tone(320*(1-c*0.5)+Math.random()*60,0.05,'square',0.04); break;
      case 'crunch': this.noise(0.15,0.5,2500); this.noise(0.12,0.4,1800); break;
      case 'good': [660,880,1100].forEach((f,i)=>this.tone(f,0.2,'sine',0.15,null,null,i*0.06)); break;
      case 'bad': this.tone(220,0.5,'sawtooth',0.12,80); break;
      case 'pill': this.tone(900,0.06,'square',0.1); this.tone(600,0.1,'sine',0.15,300,null,0.07); break;
      case 'whisper': this.noise(1.8,0.3,2400+Math.random()*900,5); this.noise(1.8,0.2,1500,3); break;
      case 'roar': this.tone(90,1.3,'sawtooth',0.3,35); this.tone(140,1,'square',0.1,50); this.noise(1.2,0.4,400,0.7,'lowpass'); break;
      case 'creak': this.tone(110,1.0,'sawtooth',0.07,260); this.tone(114,1.0,'sawtooth',0.07,255); break;
      case 'sting': this.tone(466,0.9,'sawtooth',0.14); this.tone(494,0.9,'sawtooth',0.14); this.tone(70,0.9,'square',0.2,40); break;
      case 'beat': this.tone(60,0.18,'sine',0.5,35); this.tone(60,0.18,'sine',0.35,35,null,0.2); break;
      case 'door': this.noise(0.25,0.3,300,1,'lowpass'); break;
      case 'splash': this.noise(0.35,0.35,1500,1); break;
      case 'ding': this.tone(1320,0.5,'sine',0.15); this.tone(1760,0.4,'sine',0.08,null,null,0.05); break;
      case 'sizzle': this.noise(0.9,0.25,6000,0.7,'highpass'); break;
      case 'branch': this.noise(0.22,0.45,900,2); this.tone(120,0.18,'sawtooth',0.12,70); break;
      case 'heartbeat': this.tone(65,0.16,'sine',0.55,45); this.tone(65,0.16,'sine',0.38,45,null,0.24); break;
      case 'scream': this.noise(1.25,0.8,1500,2); this.tone(880,0.9,'sawtooth',0.28,180); this.tone(440,1.0,'square',0.16,90); break;
    }
  }
}

class ChecklistUI {
  constructor(scene,state){
    this.scene=scene; this.state=state; this.rows=[]; this.open=state.uiOpen===true; const f={fontFamily:FONT};
    this.head=scene.add.rectangle(12,12,290,28,0xfbbf24,0.97).setOrigin(0).setScrollFactor(0).setDepth(9000).setStrokeStyle(4,0xf2b705).setInteractive({useHandCursor:true});
    this.head.on('pointerdown',()=>this.toggle());
    this.title=scene.add.text(22,17,'',{...f,fontSize:'16px',color:'#7c2d12',fontStyle:'bold'}).setScrollFactor(0).setDepth(9001);
    this.body=scene.add.container(12,40).setScrollFactor(0).setDepth(9000).setVisible(this.open);
    this.body.add(scene.add.rectangle(0,0,290,10+state.tasks.length*26,0xfff3a0,0.95).setOrigin(0).setStrokeStyle(4,0xf2b705));
    state.tasks.forEach((t,i)=>{
      const box=scene.add.text(10,6+i*26,'☐',{fontSize:'18px',color:'#333'}), txt=scene.add.text(34,7+i*26,'',{...f,fontSize:'14px',color:'#333',wordWrap:{width:245}});
      this.body.add([box,txt]); this.rows.push({task:t,box,txt,i,checked:state.done.has(t.id),glitchUntil:0,flipUntil:0});
    });
    this.onTask=id=>this.setStatus(id,true); state.on('task',this.onTask); scene.events.once('shutdown',()=>state.off('task',this.onTask)); this.refresh();
  }
  toggle(){ this.open=!this.open; this.state.uiOpen=this.open; this.body.setVisible(this.open); this.refresh(); }
  setStatus(id,done){ const r=this.rows.find(r=>r.task.id===id); if(!r) return; r.checked=done; this.refresh(); if(done&&this.state.corruptionLevel<0.5) this.starBurst(r.i); }
  refresh(){
    const c=this.state.corruptionLevel, now=this.scene.time.now; let done=0;
    this.rows.forEach(r=>{
      const bad=r.task.corruptText&&(c>=0.75||now<r.glitchUntil), shown=now<r.flipUntil?!r.checked:r.checked; if(r.checked) done++;
      r.txt.setText(bad?r.task.corruptText:`${r.task.icon} ${r.task.text}`); r.txt.setColor(bad&&c>0.7?'#991b1b':'#333'); r.box.setText(shown?'☑':'☐');
    });
    this.title.setText(`📋 TASKS  ${done}/${this.rows.length}   ${this.open?'▲':'▼'}`);
  }
  starBurst(i){ const s=this.scene.add.text(40,this.open?46+i*26:26,'★',{fontSize:'28px',color:'#f59e0b'}).setScrollFactor(0).setDepth(9002); this.scene.tweens.add({targets:s,scale:3,alpha:0,duration:500,onComplete:()=>s.destroy()}); }
  update(time){
    const c=this.state.corruptionLevel, j=this.state.params.uiJitterAmount;
    this.rows.forEach(r=>{ r.txt.x=34+(j?Phaser.Math.FloatBetween(-j,j)*0.4:0); r.txt.y=r.box.y+1+(j?Phaser.Math.FloatBetween(-j,j)*0.4:0); });
    if(c>=0.4&&Math.random()<0.003*(1+c*3)){
      const r=Phaser.Utils.Array.GetRandom(this.rows);
      if(Math.random()<0.5) r.flipUntil=time+Phaser.Math.Between(700,1800); else r.glitchUntil=time+Phaser.Math.Between(600,2000);
      this.refresh(); this.scene.time.delayedCall(2000,()=>this.refresh());
    }
  }
}

class Dialogue {
  constructor(sc,keys){
    this.sc=sc; this.k=keys; this.active=false; this.timer=null; this.choosing=false;
    this.c=sc.add.container(0,0).setScrollFactor(0).setDepth(9500).setVisible(false);
    this.bg=sc.add.rectangle(40,425,720,145,0xfff8dc,0.97).setOrigin(0).setStrokeStyle(5,0x92400e);
    this.nm=sc.add.text(58,435,'',{fontFamily:FONT,fontSize:'19px',fontStyle:'bold',color:'#c2410c'});
    this.tx=sc.add.text(58,466,'',{fontFamily:FONT,fontSize:'18px',color:'#222',wordWrap:{width:684},lineSpacing:4});
    this.hint=sc.add.text(750,562,'▼ E',{fontFamily:FONT,fontSize:'14px',color:'#92400e'}).setOrigin(1,1);
    this.c.add([this.bg,this.nm,this.tx,this.hint]);
  }
  open(lines,onEnd){
    this.q=[...(lines||[])]; this.onEnd=onEnd; this.active=true; this.c.setVisible(true);
    const bad=this.sc.state.phase>=4; this.bg.setFillStyle(bad?0x1a0708:0xfff8dc,0.97).setStrokeStyle(5,bad?0x7f1d1d:0x92400e); this.tx.setColor(bad?'#ff5555':'#222'); this.next();
  }
  next(){
    if(!this.q.length){ this.active=false; this.c.setVisible(false); if(this.onEnd) this.onEnd(); return; }
    const l=this.cur=this.q.shift(); this.nm.setText(l.who); this.full=l.text; this.i=0; this.choosing=false; this.hint.setVisible(true); this.tx.setText('');
    if(l.fx) this.sc.onFx(l.fx); if(l.sanity) this.sc.state.addSanity(l.sanity);
    if(this.timer) this.timer.remove();
    this.timer=this.sc.time.addEvent({delay:24,loop:true,callback:()=>{ this.i++; this.tx.setText(this.full.slice(0,this.i)); if(this.i%2===0) this.sc.audio.sfx('blip'); if(this.i>=this.full.length) this.doneTyping(); }});
  }
  doneTyping(){
    if(this.timer){ this.timer.remove(); this.timer=null; } this.tx.setText(this.full);
    if(this.cur.ask){ this.choosing=true; this.tx.setText(this.full+'\n\n1) '+this.cur.ask[0]+'        2) '+this.cur.ask[1]); this.hint.setVisible(false); }
  }
  update(){
    const J=Phaser.Input.Keyboard.JustDown, k=this.k;
    this.tx.x=58+(this.sc.state.phase>=4?Phaser.Math.FloatBetween(-1.5,1.5):0);
    if(this.timer){ if(J(k.E)||J(k.SP)) this.doneTyping(); return; }
    if(this.choosing){ if(J(k.N1)) this.pick(0); else if(J(k.N2)) this.pick(1); return; }
    if(J(k.E)||J(k.SP)) this.next();
  }
  pick(i){ this.q.unshift(...this.cur.then[i]); this.next(); }
}

const tex=(s,key,w,h,fn)=>{ const g=s.make.graphics({add:false}); fn(g); g.generateTexture(key,w,h); g.destroy(); };
function drawPerson(g,o,dir,f,walk,expression='neutral'){
  const sw=walk?[-3,0,3,0][f]:0, b=12-(walk?f%2:f);
  g.fillStyle(0x000000,0.25).fillEllipse(16,50,22,6); g.fillStyle(o.pants);

  g.fillStyle(0x222222); if(dir==='s'){ g.fillRect(12+sw,48,7,2); g.fillRect(16-sw,48,7,2); } else { g.fillRect(9,48,7,2); g.fillRect(17,48,7,2); }
  if(dir!=='s'){ g.fillStyle(o.shirt).fillRect(4,b+13+sw,5,10).fillRect(24,b+13-sw,5,10); g.fillStyle(o.skin).fillRect(4,b+21+sw,5,3).fillRect(24,b+21-sw,5,3); }
  g.fillStyle(o.shirt).fillRoundedRect(8,b+11,17,18,4); if(o.sash) g.fillStyle(o.sash).fillRect(10,b+16,4,12);
  if(dir==='s'){ g.fillStyle(o.shirt).fillRect(14-sw,b+13,5,10); g.fillStyle(o.skin).fillRect(14-sw,b+21,5,3); }
  g.fillStyle(o.skin).fillCircle(16,b+4,9); g.fillStyle(o.hair); g.beginPath(); g.arc(16,b+4,9,Math.PI,Math.PI*2); g.closePath(); g.fillPath();
  if(dir==='u') g.fillCircle(16,b+4,9); if(dir==='s') g.fillRect(7,b+2,6,8);
  g.fillStyle(0x222222);
  if(dir==='d'){
    const eyeY=b+6, eyeGap=3.5;
    if(expression==='scared'||expression==='horrified'){
      g.fillStyle(0xffffff).fillCircle(12.5,eyeY,2.7).fillCircle(19.5,eyeY,2.7);
      g.fillStyle(0x111111).fillCircle(12.5,eyeY,1.1).fillCircle(19.5,eyeY,1.1);

    } else if(expression==='worried'){

      g.fillStyle(0xf28b82).fillRect(14,b+9,4,1.5);

    this.cap=this.add.text(400,60,"Don't look back...",{fontFamily:'Georgia, serif',fontSize:'30px',fontStyle:'italic',color:'#dcdcdc',stroke:'#000',strokeThickness:6}).setOrigin(.5).setDepth(30);
    this.tweens.add({targets:this.cameras.main,zoom:1.07,duration:4600,ease:'Sine.easeIn'}); this.cameras.main.shake(4600,0.0025);

    this.time.delayedCall(700,()=>{ this.cap.setText('YOU SHOULD NOT HAVE LOOKED.').setColor('#ff3030').setFontSize(34).setDepth(60).setFontStyle('bold'); });

/* ============================================================
   ROOM SCENE
   ============================================================ */
class RoomScene extends Phaser.Scene {
  constructor(){ super('Room'); }
  init(d){ this.roomId=d.room||'town'; this.spawn=d.spawn||[12,10]; this.state=this.registry.get('state'); this.audio=this.registry.get('audio'); }
  wall(cx,cy,w,h){ const r=this.add.rectangle(cx,cy,w,h).setVisible(false); this.physics.add.existing(r,true); this.blocks.push(r); }

  create(){
    const st=this.state, R=ROOMS[this.roomId], W=R.w*T, H=R.h*T;
    this.ox=Math.max(0,(800-W)/2); this.oy=Math.max(0,(600-H)/2);
    const P=(x,y)=>[this.ox+x*T,this.oy+y*T];
    this.blocks=[]; this.sunflowers=[]; this.spr={}; this.busy=false; this.acting=false; this.act=null;
    this.born=null;   // set on first update: a scene's own clock is stale after a restart, which made the house monster spawn instantly on retry
    this.hm=null; this.houseWarned=false; this.mayorMonster=st.mayorMonster; this.beatT=0; this.nextVoice=Phaser.Math.Between(6000,12000);
    this.chase=(this.roomId==='town'&&st.mayorMonster)?{mode:'buffer',t:5000}:{mode:'none',t:0};   // buffer -> 30s run -> zoom
    this.cameras.main.setBackgroundColor(R.bg).fadeIn(400);

    const data=[]; for(let y=0;y<R.h;y++){ const row=[]; for(let x=0;x<R.w;x++) row.push(R.tile(x,y)); data.push(row); }
    const map=this.make.tilemap({data,tileWidth:T,tileHeight:T});
    this.layer=map.createLayer(0,map.addTilesetImage('tiles','tiles',T,T,0,0),this.ox,this.oy); this.layer.setCollision([2,4]);

    const place=p=>{
      const [x,y]=P(p.x,p.y); let s=null;
      if(p.k){ s=this.add.image(x,y,p.k).setOrigin(.5,1).setDepth(p.d!==undefined?p.d:y); this.spr[p.k]=s;
        if(p.sway) this.tweens.add({targets:s,angle:{from:-2.5,to:2.5},duration:Phaser.Math.Between(1300,2300),delay:Math.random()*900,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
        if(p.sf) this.sunflowers.push(s); }
      if(p.b) this.wall(x,y-p.b[1]/2,p.b[0],p.b[1]);
      return [x,y,s];
    };
    R.props.forEach(place);
    (R.walls||[]).forEach(([x,y,w,h])=>this.wall(this.ox+(x+w/2)*T,this.oy+(y+h/2)*T,w*T,h*T));

    this.triggers=R.triggers.map(d=>{
      const t={...d};
      if(d.npc){ [t.x,t.y]=P(d.x,d.y); t.sprite=this.add.sprite(t.x,t.y,'mayor_i0').setOrigin(.5,.96).play('mayor_idle'); }
      else { const [x,y,s]=place(d); t.x=x; t.y=y; t.sprite=s; if(d.npcId) this.makeNpc(t); }
      if(d.icon){
        const sp=t.sprite||(d.over&&this.spr[d.over]), iy=sp?sp.y-sp.displayHeight-14:t.y-(d.ih||40);
        t.iconObj=this.add.text(t.x,iy,d.icon,{fontSize:'22px'}).setOrigin(.5).setDepth(8000);
        if(!d.npc) this.tweens.add({targets:t.iconObj,y:iy-6,duration:600,yoyo:true,repeat:-1,ease:'Sine.easeInOut'}); }
      return t;
    });
    this.mayor=this.triggers.find(t=>t.npc);
    if(this.mayor){ this.styleMayor(); this.mayor.disabled=this.mayorMonster; }

    if(st.day>=2&&this.sunflowers[0]) this.sunflowers[0].setTint(0x8a8a5a).setScale(1,0.8);
    if(st.day>=4) this.sunflowers.forEach((s,i)=>{ if(i%2) s.setTint(0x9a9a6a); });
    if(st.day>=7&&this.spr.scarecrow) this.spr.scarecrow.setTint(0x991b1b);
    if(st.phase>=4){ if(this.spr.pond) this.spr.pond.setTint(0x7a1010); if(this.spr.creek) this.spr.creek.setTint(0x8a1c1c); if(this.spr.river&&st.day>=9) this.spr.river.setTint(0x9a3a3a); }

    const [sx,sy]=P(...this.spawn);
    this.player=this.physics.add.sprite(sx,sy,'bob_d_i0').setOrigin(.5,.96).play('bob_idle_d');
    this.player.body.setSize(14,10).setOffset(9,40); this.player.setCollideWorldBounds(true); this.facing='d';
    this.physics.world.setBounds(this.ox,this.oy,W,H);
    this.physics.add.collider(this.player,this.layer); this.physics.add.collider(this.player,this.blocks);
    this.cameras.main.setBounds(0,0,Math.max(800,W),Math.max(600,H)).startFollow(this.player,true,0.15,0.15);

    this.cursors=this.input.keyboard.createCursorKeys(); this.wasd=this.input.keyboard.addKeys('W,A,S,D');
    this.keys=this.input.keyboard.addKeys({E:'E',SP:'SPACE',N1:'ONE',N2:'TWO',Q:'Q',T:'T',M:'M',ESC:'ESC'});
    this.checklist=new ChecklistUI(this,st); this.dlg=new Dialogue(this,this.keys); this.mapUI=new MapUI(this);
    this.prompt=this.add.text(0,0,'',{fontSize:'14px',color:'#fff',backgroundColor:'#000a',padding:{x:5,y:3}}).setDepth(8500).setVisible(false).setOrigin(.5);
    const hud=(x,y,txt,sz,ox=1)=>this.add.text(x,y,txt,{fontFamily:FONT,fontSize:sz,color:'#fff',stroke:'#000',strokeThickness:4}).setScrollFactor(0).setDepth(9000).setOrigin(ox,0);
    hud(788,10,`Day ${st.day}`,'22px'); hud(788,38,R.name,'14px'); hud(788,58,'🧠 SANITY','12px'); this.pillText=hud(788,96,'','13px');
    hud(788,128,'🗺 MAP [M]','13px').setInteractive({useHandCursor:true}).on('pointerdown',()=>this.toggleMap());
    hud(400,592,'Move: Arrows/WASD   Interact: E   Pill: Q   Tasks: T   Map: M',' 12px',.5).setOrigin(.5,1);
    this.timerText=this.add.text(400,10,'',{fontFamily:FONT,fontSize:'26px',fontStyle:'bold',color:'#ff4444',stroke:'#000',strokeThickness:6}).setOrigin(.5,0).setScrollFactor(0).setDepth(9000);
    this.bars=this.add.graphics().setScrollFactor(0).setDepth(9000); this.actBar=this.add.graphics().setDepth(8600);
    this.grade=this.add.rectangle(0,0,800,600,0x8a9a6a).setOrigin(0).setScrollFactor(0).setDepth(8800).setBlendMode(Phaser.BlendModes.MULTIPLY);
    this.vignette=this.add.image(0,0,'vignette').setOrigin(0).setScrollFactor(0).setDepth(8801);
    this.dark=this.add.rectangle(0,0,800,600,0x000000).setOrigin(0).setScrollFactor(0).setDepth(8802);
    this.noise=this.add.rectangle(0,0,800,600,0xffffff).setOrigin(0).setScrollFactor(0).setDepth(8803).setAlpha(0);
    this.houseLimit=this.roomId==='house'?[0,42000,34000,25000][st.phase-1]:0;
  }

  makeNpc(t){
    const st=this.state, id=t.npcId, n=NPCS[id], f=t.fate=n.fate(st.day); let s;
    if(f==='dead'){ s=this.add.image(t.x,t.y,'brenda_dead').setOrigin(.5,.8); if(s.preFX) s.preFX.addBlur(0,1.8,1.8,1.3); }   // blurred, headless body
    else if(f==='gone') s=this.add.image(t.x,t.y,n.left).setOrigin(.5,1);
    else if(f==='shadow'){ s=this.add.sprite(t.x,t.y,`npc_${id}_shadow`).setOrigin(.5,.96).setScale(1,1.14); t.disabled=true; }   // just stares
    else { s=this.add.sprite(t.x,t.y,`npc_${id}_i0`).setOrigin(.5,.96).play(`npc_${id}_idle`);
      if(f==='uneasy') s.setTint(0xd0d0d0); if(f==='hunted'){ s.setTint(0x9aa0a6); this.tweens.add({targets:s,x:t.x+2,duration:70,yoyo:true,repeat:-1}); } }
    s.setDepth(t.y); t.sprite=s;
  }
  styleMayor(){ const s=this.mayor.sprite, d=this.state.day; if(this.mayorMonster) this.makeMonster(); else if(d>=6) s.setScale(0.92,1.2); else if(d>=5) s.setScale(0.96,1.1); else if(d>=3) s.setScale(1,1.04); }
  makeMonster(){ const s=this.mayor.sprite; s.stop(); s.setTexture('monster').setScale(1).setRotation(0); this.tweens.add({targets:s,scaleY:1.06,duration:500,yoyo:true,repeat:-1}); }
  onFx(fx){ if(fx==='monster'){ this.state.mayorMonster=this.mayorMonster=true; this.mayor.disabled=true; this.makeMonster(); this.audio.sfx('roar'); this.cameras.main.shake(700,0.02); this.cameras.main.flash(400,255,0,0); } }

  goTo(room,spawn,onMid){
    if(this.busy) return; this.busy=true; this.player.setVelocity(0); this.cameras.main.fadeOut(350,0,0,0);
    this.cameras.main.once('camerafadeoutcomplete',()=>{ if(onMid) onMid(); this.scene.restart({room,spawn}); });
  }
  toggleMap(){ if(!this.mapUI.open&&(this.dlg.active||this.busy||this.acting||this.chase.mode==='zoom')) return; this.mapUI.toggle(); }
  flash(msg){ const t=this.add.text(this.player.x,this.player.y-64,msg,{fontSize:'15px',color:'#fff',stroke:'#000',strokeThickness:3,align:'center',wordWrap:{width:300}}).setOrigin(.5,1).setDepth(8600);
    this.tweens.add({targets:t,y:t.y-24,alpha:0,duration:1800,onComplete:()=>t.destroy()}); }
  emote(o,e){ if(!o||!o.scene) return; const s=this.fxText(e,o.x,o.y-o.displayHeight-8,'20px'); this.tweens.add({targets:s,y:s.y-16,alpha:0,duration:1100,onComplete:()=>s.destroy()}); }
  voice(txt){
    const big=this.state.phase>=4;
    const t=this.add.text(400,big?290:490,txt,{fontFamily:'Georgia, serif',fontSize:big?'34px':'22px',fontStyle:'italic',color:big?'#ff2a2a':'#d8d8e8',stroke:'#000',strokeThickness:5,align:'center',wordWrap:{width:700}}).setOrigin(.5).setScrollFactor(0).setDepth(9400).setAlpha(0);
    this.audio.sfx('whisper'); if(big&&Math.random()<0.4) this.audio.sfx('sting');
    this.tweens.add({targets:t,alpha:big?1:0.85,duration:900,yoyo:true,hold:big?1800:1500,onComplete:()=>t.destroy()});
    if(big) this.tweens.add({targets:t,x:{from:394,to:406},duration:60,yoyo:true,repeat:45});
  }
  randVoice(){ return Phaser.Utils.Array.GetRandom([[],VOICE_MILD,VOICE_MID,VOICE_SEVERE][this.state.phase-1]); }
  takePill(){
    const st=this.state, now=performance.now();
    if(now<st.pillReadyAt) return this.flash(`Wait ${Math.ceil((st.pillReadyAt-now)/1000)}s`);
    st.pillReadyAt=now+15000; st.addSanity(22); this.audio.sfx('pill'); this.flash('💊 Sanity +22');
  }
  lore(t){ this.flash(LORE[t.id][this.state.phase>=2?1:0]); }
  finish(task,t){
    if(!this.state.completeTask(task.id)) return;
    const ph=this.state.phase; this.audio.sfx('success'); if(t&&LORE[t.id]) this.lore(t); else this.flash(['Yay!','Done.','Done...','...'][ph-1]);
    if(ph>=4&&Math.random()<0.4) this.voice(this.randVoice()); else if(ph===3&&Math.random()<0.2) this.voice(this.randVoice());
  }
  die(){ if(this.busy) return; this.busy=true; this.player.setVelocity(0); this.scene.start('Chase'); }
  escaped(){   // days 8+: leaving town alive while Barnaby hunts = the Barnaby task
    const st=this.state; if(this.roomId!=='town'||!this.mayorMonster||st.day<8) return;
    const mt=st.tasks.find(k=>k.trigger==='mayor'&&!st.done.has(k.id));
    if(mt&&(this.chase.mode==='buffer'||this.chase.mode==='run')){ st.completeTask(mt.id); this.audio.sfx('success'); }
  }

  /* ---------- interaction ---------- */
  interact(t){
    const st=this.state, task=st.tasks.find(k=>k.trigger===t.id&&!st.done.has(k.id));
    if(t.type==='door'){ this.escaped(); this.audio.sfx('door'); return this.goTo(t.to,t.spawn); }
    if(t.type==='bed'){
      if(!st.allDone()) return this.flash('Still things to do!');
      if(st.day>=10){ this.busy=true; this.cameras.main.fadeOut(1200,0,0,0); return this.cameras.main.once('camerafadeoutcomplete',()=>this.scene.start('End',{good:true})); }
      return this.goTo('house',[7,7.2],()=>st.nextDay());
    }
    if(t.id==='mayor'){
      if(this.mayorMonster) return this.flash('It does not answer. RUN.');
      let lines; if(!st.talked.mayor){ st.talked.mayor=true; lines=MAYOR_TALK[st.day]||MAYOR_TALK[6]; } else lines=[M(Phaser.Utils.Array.GetRandom(MAYOR_SMALL[Math.min(st.phase,3)]))];
      this.emote(t.sprite,'💬');
      this.dlg.open(lines,()=>{ if(task) this.finish(task,t); if(this.mayorMonster&&this.chase.mode==='none') this.chase={mode:'buffer',t:8000}; });   // 8s head start after he transforms
      return;
    }
    if(t.npcId){
      const id=t.npcId, n=NPCS[id], cv=TALK[id][t.fate]; if(!cv) return this.flash('...');
      this.emote(t.sprite,{ok:'💬',uneasy:'❓',hunted:'⚠️',dead:'💀',gone:'❔'}[t.fate]||'💬');
      let lines; if(!st.talked[id]){ st.talked[id]=true; lines=cv[st.day%cv.length]; } else lines=[{who:n.name,text:Phaser.Utils.Array.GetRandom((SMALL[id]&&SMALL[id][t.fate])||['...'])}];
      this.dlg.open(lines,()=>{ if(task) this.finish(task,t); }); return;
    }
    if(t.id==='board'){ this.dlg.open([{who:'📋 Notice Board',text:BOARD_TXT[st.phase-1]}],()=>{ if(task) this.finish(task,t); }); return; }
    if(t.id==='basket'){
      return this.startAction(t,()=>{ const good=Math.random()<0.25; this.audio.sfx('crunch'); this.audio.sfx(good?'good':'bad');
        st.addSanity(good?12:-10); this.flash(good?'🍎 Sweet! Sanity +12':'🍎 Rotten... Sanity -10'); if(task) this.finish(task,null); });
    }
    if(task) return this.startAction(t,()=>this.finish(task,t));
    if(LORE[t.id]) return this.lore(t);
    this.flash('Nothing to do here.');
  }

  /* ---------- custom animation per task ----------
     Everything animated is recorded and RESTORED afterwards (position + scale, never angle),
     so objects can no longer get stuck tilted or shaking. */
  fxText(e,x,y,size='22px'){ return this.add.text(x,y,e,{fontSize:size}).setOrigin(.5).setDepth(8700); }
  startAction(t,onDone){
    const a=ACTIONS[t.id]||{e:'✨',ms:800,kind:'rise'}, KD=a.kind, sev=this.state.phase>=4, R=Phaser.Math.Between, px=this.player.x, py=this.player.y, tg=t.sprite;
    const em=(i=0)=>(sev&&!['throw','stamp','sweep','foot','cast','orbit','glow','spin'].includes(KD))?'🩸':(Array.isArray(a.e)?a.e[i%a.e.length]:a.e);
    const objs=[], tws=[], undo=[], base=tg?{x:tg.x,y:tg.y,sx:tg.scaleX,sy:tg.scaleY}:null;
    const fx=(e,x,y,sz)=>{ const o=this.fxText(e,x,y,sz); objs.push(o); return o; }, tw=c=>{ const w=this.tweens.add(c); tws.push(w); return w; };
    const bump=()=>{ if(tg) tw({targets:tg,scaleX:base.sx*1.14,scaleY:base.sy*0.86,duration:80,yoyo:true,repeat:1}); };
    const jig=(m=3,rep=5)=>{ if(tg) tw({targets:tg,x:base.x+m,duration:50,yoyo:true,repeat:rep}); };
    const later=(ms,f)=>this.time.delayedCall(ms,()=>{ if(this.act) f(); });
    const fall=(e,x,y,dy,ms)=>{ const s=fx(e,x,y); tw({targets:s,y:y+dy,alpha:0,duration:ms}); };
    this.acting=true; this.player.setVelocity(0); this.act={t0:this.time.now,ms:a.ms};
    const dx=t.x-px; if(Math.abs(dx)>10){ this.facing='s'; this.player.setFlipX(dx<0); } else this.facing=t.y<py?'u':'d';
    tw({targets:this.player,scaleY:0.9,scaleX:1.06,duration:130,yoyo:true,repeat:-1});
    let tick=null;
    switch(KD){
      case 'throw': (Array.isArray(a.e)?a.e:[a.e]).forEach((e,j)=>later(j*260,()=>{ const s=fx(e,px,py-30,'24px');
          tw({targets:s,x:t.x,duration:a.ms*0.5,ease:'Sine.easeInOut'});
          tw({targets:s,y:t.y-24,angle:360,duration:a.ms*0.5,ease:'Back.easeIn',onComplete:()=>{ s.destroy(); bump(); this.audio.sfx(t.id==='mailbox'?'ding':'blip'); }}); })); break;
      case 'stamp': { const s=fx(a.e,t.x,t.y-80,'36px'); tw({targets:s,y:t.y-26,scale:{from:1.7,to:1},duration:420,ease:'Bounce.easeOut',onComplete:()=>{
          const c=fx('✔️',t.x+18,t.y-34,'22px'); tw({targets:c,scale:{from:0.2,to:1.3},duration:200}); jig(2,3); this.audio.sfx('ding'); this.cameras.main.shake(60,0.004); }}); } break;
      case 'water': { const sb=this.sunflowers.map(s=>[s,s.scaleX,s.scaleY]); undo.push(()=>sb.forEach(([s,x,y])=>s.setScale(x,y)));
        sb.forEach(([s,x,y],i)=>tw({targets:s,scaleY:y*1.25,scaleX:x*1.08,duration:200,yoyo:true,repeat:3,delay:i*130}));
        tick=()=>{ const s=Phaser.Utils.Array.GetRandom(this.sunflowers); if(s) fall(em(),s.x+R(-8,8),s.y-70,56,500); }; this.audio.sfx('splash'); } break;
      case 'scatter': tick=()=>{ const s=fx(em(),px,py-26,'18px'), x=t.x+R(-34,34), y=t.y-R(2,20);
          tw({targets:s,x,y,angle:180,duration:420,onComplete:()=>{ s.destroy(); const r=this.add.ellipse(x,y,6,3).setStrokeStyle(2,sev?0x7a1010:0xffffff).setFillStyle(0xffffff,0).setDepth(8700); objs.push(r);
            tw({targets:r,scale:6,alpha:0,duration:600}); if(Math.random()<0.3){ const d=fx('🦆',x,y-4,'16px'); tw({targets:d,y:y-22,duration:250,yoyo:true}); } }}); }; break;
      case 'cook': { const pan=fx('🍳',t.x,t.y-46,'26px'); tw({targets:pan,x:t.x+3,duration:60,yoyo:true,repeat:-1}); tick=()=>fall(em(),t.x+R(-14,14),t.y-56,-40,800); this.audio.sfx('sizzle'); } break;
      case 'bucket': { const b=fx('🪣',t.x,t.y-58,'26px'); tw({targets:b,y:t.y-8,duration:420,yoyo:true,repeat:1,hold:150,onYoyo:()=>{ this.audio.sfx('splash'); const s=fx('💦',t.x,t.y-14,'20px'); tw({targets:s,y:t.y-40,alpha:0,duration:500}); }}); } break;
      case 'cast': { const bx=t.x+R(6,24), by=t.y+R(34,46), g=this.add.graphics().setDepth(8650), fl=this.add.circle(bx,by,4,0xdc2626).setDepth(8700); objs.push(g,fl);
        tw({targets:{v:0},v:1,duration:a.ms,onUpdate:()=>{ g.clear().lineStyle(1,0xffffff,0.85).lineBetween(px+8,py-34,bx,fl.y); }});
        tw({targets:fl,y:by+6,duration:150,yoyo:true,repeat:5,delay:500});
        later(a.ms*0.7,()=>{ const f=fx('🐟',bx,by,'22px'); tw({targets:f,y:by-46,duration:350,yoyo:true,ease:'Sine.easeOut'}); this.audio.sfx('splash'); }); } break;
      case 'orbit': { const bees=[0,1,2,3,4].map(i=>fx(em(i),t.x,t.y-24,'14px')), c={v:0};
        tw({targets:c,v:360,duration:900,repeat:-1,onUpdate:()=>bees.forEach((b,i)=>{ const an=(c.v+i*72)*Math.PI/180; b.setPosition(t.x+Math.cos(an)*28,t.y-26+Math.sin(an)*12); })}); jig(2,9); } break;
      case 'glow': { const gl=this.add.circle(t.x,t.y-10,8,0xffd54a,0.55).setDepth(8650); objs.push(gl); tw({targets:gl,scale:7,alpha:0,duration:600,repeat:1});
        tick=()=>fall('✨',t.x+R(-18,18),t.y-20,-30,600); this.audio.sfx('good'); } break;
      case 'sweep': { const br=fx('🧹',t.x-16,t.y-22,'26px'); tw({targets:br,angle:{from:-35,to:35},duration:170,yoyo:true,repeat:-1}); jig(4,-1); tick=()=>fall('💨',t.x+R(-24,24),t.y-R(4,40),-20,600); } break;
      case 'shake': jig(4,17); tick=()=>fall(em(),t.x+R(-20,20),t.y-60,60,600); break;
      case 'foot': for(let i=0;i<7;i++) later(i*190,()=>{ const s=fx('👣',t.x-60+i*20,t.y+(i%2?6:-6),'14px'); tw({targets:s,alpha:0,duration:900,delay:200}); }); break;
      case 'spin': { const gr=fx(a.e,t.x,t.y-70,'42px'); tw({targets:gr,angle:720,duration:a.ms}); this.audio.sfx('creak'); jig(2,9); } break;
      case 'boat': { const bt=fx(a.e,t.x-40,t.y+6,'22px'); tw({targets:bt,x:t.x+50,duration:a.ms}); tw({targets:bt,y:t.y+2,duration:250,yoyo:true,repeat:5}); tick=()=>fall('💧',t.x+R(-30,30),t.y-30,34,450); } break;
      case 'lift': if(tg) tw({targets:tg,y:base.y-14,duration:350,yoyo:true,hold:300}); tick=()=>fall('💨',t.x+R(-10,10),t.y-4,-18,500); break;
      default: tick=()=>fall(em(),t.x+R(-16,16),t.y-36,-46,850);
    }
    let ev=null; if(tick){ tick(); ev=this.time.addEvent({delay:150,loop:true,callback:()=>{ if(this.act) tick(); }}); }
    this.time.delayedCall(a.ms,()=>{
      if(ev) ev.remove(); tws.forEach(w=>{ try{ w.stop(); }catch(e){} }); objs.forEach(o=>{ if(o&&o.scene) o.destroy(); }); undo.forEach(f=>f());
      if(tg&&tg.scene){ tg.x=base.x; tg.y=base.y; tg.setScale(base.sx,base.sy); }
      this.player.setScale(1); this.acting=false; this.act=null; if(this.busy) return;
      for(let i=0;i<7;i++){ const s=this.fxText(sev?'🩸':'⭐',t.x,t.y-30,'18px'), an=i/7*Math.PI*2; this.tweens.add({targets:s,x:t.x+Math.cos(an)*36,y:t.y-30+Math.sin(an)*36,alpha:0,duration:650,onComplete:()=>s.destroy()}); }
      onDone();
    });
  }
  drawAct(time){
    const g=this.actBar; g.clear(); if(!this.act) return;
    const f=Math.min(1,(time-this.act.t0)/this.act.ms), x=this.player.x-22, y=this.player.y-64;
    g.fillStyle(0x000000,0.65).fillRoundedRect(x-2,y-2,48,10,4); g.fillStyle(this.state.phase>=4?0xef4444:0xfacc15,1).fillRoundedRect(x,y,44*f,6,3);
  }

  /* ---------- horror ---------- */
  spawnHouseMonster(){
    const big=this.state.phase>=4, x=this.ox+3*T, y=this.oy+4.5*T;
    this.hm=this.add.sprite(x,y,big?'monster':'shadow').setOrigin(.5,.96).setDepth(y);
    this.audio.sfx(big?'roar':'creak'); this.cameras.main.shake(500,0.012); this.voice(big?'IT FOUND YOU.':'Something is in the house.');
  }
  forceOut(){ this.audio.sfx('sting'); this.cameras.main.flash(300,255,255,255); this.goTo('town',[5.5,6.6],()=>this.state.addSanity([0,-15,-22,-30][this.state.phase-1])); }

  /* ---------- loop ---------- */
  drawHud(){
    const st=this.state, s=st.sanity/100, jx=s<0.3?Phaser.Math.FloatBetween(-1.5,1.5):0, g=this.bars;
    g.clear(); g.fillStyle(0x000000,0.65).fillRoundedRect(624,72,168,20,6); g.fillStyle(s>0.5?0x4ade80:s>0.25?0xfacc15:0xef4444,1).fillRoundedRect(628+jx,76,160*s,12,4);
    const rem=st.pillReadyAt-performance.now(); this.pillText.setText(rem>0?`💊 ${Math.ceil(rem/1000)}s`:'💊 Ready [Q]').setColor(rem>0?'#f87171':'#86efac');
    if(rem>0){ g.fillStyle(0x000000,0.65).fillRoundedRect(690,114,102,8,3); g.fillStyle(0xa78bfa,1).fillRoundedRect(690,114,102*(1-rem/15000),8,3); }
  }
  update(time,delta){
    if(this.born===null) this.born=time;
    const st=this.state, p=st.params, dt=delta/1000, JD=Phaser.Input.Keyboard.JustDown;
    this.grade.setAlpha(p.desaturation); this.vignette.setAlpha(Math.min(1,p.desaturation*1.2)); this.dark.setAlpha(p.lightingDarkness*0.6);
    this.drawHud(); this.checklist.update(time); this.drawAct(time);
    if(JD(this.keys.T)&&!this.dlg.active) this.checklist.toggle();
    if(JD(this.keys.M)) this.toggleMap(); if(JD(this.keys.ESC)&&this.mapUI.open) this.mapUI.toggle(false);
    if(this.dlg.active){ this.player.setVelocity(0); this.animate(0,0); this.dlg.update(); return; }
    if(this.mapUI.open){ this.player.setVelocity(0); this.animate(0,0); return; }

    if(!this.busy){
      st.sanity=Math.max(0,st.sanity-DRAIN[st.day-1]*dt);
      if(st.sanity<=0){ if(st.phase>=4) return this.die(); this.flash('Bob blacks out...'); this.goTo('house',[7,7.2],()=>{ st.sanity=40; }); }
    }
    if(st.sanity<30&&(this.beatT-=delta)<=0){ this.beatT=1000; this.audio.sfx('beat'); if(st.sanity<15) this.cameras.main.shake(120,0.003); }
    if(JD(this.keys.Q)&&!this.busy) this.takePill();

    if(st.phase>=2&&!this.busy&&(this.nextVoice-=delta)<=0){
      this.voice(this.randVoice());
      this.nextVoice=([0,Phaser.Math.Between(18000,32000),Phaser.Math.Between(12000,22000),Phaser.Math.Between(7000,14000)][st.phase-1])*(0.6+0.4*st.sanity/100);
    }

    const zoom=this.chase.mode==='zoom';
    const k=this.cursors, w=this.wasd, sp=140;
    let vx=(k.right.isDown||w.D.isDown?1:0)-(k.left.isDown||w.A.isDown?1:0), vy=(k.down.isDown||w.S.isDown?1:0)-(k.up.isDown||w.W.isDown?1:0);
    if(this.busy||this.acting){ vx=vy=0; }
    this.player.setVelocity(vx*sp,vy*sp); if(vx&&vy) this.player.body.velocity.normalize().scale(sp);
    this.animate(vx,vy);

    this.triggers.forEach(t=>{ if(!t.iconObj) return; const pend=st.tasks.some(k=>k.trigger===t.id&&!st.done.has(k.id)); t.iconObj.setVisible(t.type==='door'||t.type==='bed'||(pend&&!t.disabled)); });
    this.triggers.forEach(t=>{ if(t.fate==='shadow'){ t.sprite.setFlipX(this.player.x<t.x).setAlpha(0.85+Math.random()*0.15); if(D(this.player.x,this.player.y,t.x,t.y)<240) st.addSanity(-1.5*dt); } });

    let near=null,best=46;
    if(!zoom) for(const t of this.triggers){   // during the final lunge there is no escape: doors and objects are locked
      const d=D(this.player.x,this.player.y,t.x,t.y);
      if(t.auto&&d<36&&time-this.born>700&&!this.busy&&!this.acting) return this.interact(t);
      if(!t.auto&&!t.disabled&&d<best){ best=d; near=t; }
    }
    this.prompt.setVisible(!!near&&!this.busy&&!this.acting);
    if(near){ this.prompt.setPosition(near.x,near.y+16).setText('[E] '+near.label);
      if(JD(this.keys.E)&&!this.busy&&!this.acting) this.interact(near); }

    if(this.mayor){
      const m=this.mayor, ch=this.chase, d=D(m.x,m.y,this.player.x,this.player.y), ang=Phaser.Math.Angle.Between(m.x,m.y,this.player.x,this.player.y);
      if(this.mayorMonster){
        if(!this.busy&&ch.mode!=='none'){
          ch.t-=delta;
          if(ch.mode==='buffer'){ m.sprite.setPosition(m.x+Phaser.Math.FloatBetween(-1.5,1.5),m.y);   // he thrashes in place: your head start
            if(ch.t<=0){ ch.mode='run'; ch.t=30000; this.audio.sfx('roar'); this.cameras.main.shake(400,0.012); } }
          else if(ch.mode==='run'&&ch.t<=0){ ch.mode='zoom'; m.sprite.setTint(0xff5555); this.audio.sfx('scream'); this.cameras.main.shake(700,0.03); this.cameras.main.flash(200,255,0,0); }
          const spd=ch.mode==='zoom'?900:ch.mode==='run'?[0,0,0,0,0,0,0,70,85,100,115][st.day]:0;
          if(spd&&d>18){ m.x+=Math.cos(ang)*spd*dt; m.y+=Math.sin(ang)*spd*dt; m.sprite.setPosition(m.x,m.y); }
          if((ch.mode==='run'||ch.mode==='zoom')&&d<30) return this.die();
        }
        m.sprite.setFlipX(this.player.x<m.x);
      } else {
        const spd=p.npcFollowSpeed>0?Math.min(p.npcFollowSpeed*2,30):0;
        if(!this.busy&&spd&&d>70){ m.x+=Math.cos(ang)*spd*dt; m.y+=Math.sin(ang)*spd*dt; m.sprite.setPosition(m.x,m.y); }
        if(p.desaturation>0.5) m.sprite.rotation=ang+Math.PI/2;
      }
      m.sprite.setDepth(m.y); if(m.iconObj) m.iconObj.setPosition(m.x,m.y-m.sprite.displayHeight-8+Math.sin(time/250)*4);
      const txt=!this.mayorMonster?'':ch.mode==='buffer'?`⚠ BARNABY WAKES IN ${Math.ceil(ch.t/1000)}`:ch.mode==='run'?`👹 ${Math.ceil(ch.t/1000)}s TO ESCAPE TOWN`:ch.mode==='zoom'?'💀 RUN!!!':'';
      this.timerText.setText(txt).setColor(ch.mode==='run'&&ch.t>10000?'#ffffff':'#ff4444');
    } else this.timerText.setText('');
    if(this.spr.scarecrow&&p.desaturation>0.35&&!this.acting) this.spr.scarecrow.setAngle(Phaser.Math.Clamp((this.player.x-this.spr.scarecrow.x)/8,-14,14));

    if(this.houseLimit&&!this.hm){
      if(!this.houseWarned&&time-this.born>this.houseLimit*0.7){ this.houseWarned=true; this.audio.sfx('creak'); this.voice("You've been here too long."); }
      if(time-this.born>this.houseLimit) this.spawnHouseMonster();
    }
    if(this.hm&&!this.busy){
      const h=this.hm, a=Phaser.Math.Angle.Between(h.x,h.y,this.player.x,this.player.y), s=(st.phase>=4?105:st.phase===3?88:70)*dt;
      h.x+=Math.cos(a)*s; h.y+=Math.sin(a)*s; h.setDepth(h.y).setFlipX(this.player.x<h.x);
      if(D(h.x,h.y,this.player.x,this.player.y)<28) this.forceOut();
    }
    this.noise.setAlpha(p.phase>=4?Phaser.Math.FloatBetween(0,0.06):0);
    if(p.phase>=2) this.dark.setAlpha(p.lightingDarkness*0.6*(Math.random()<0.02?1.5:1));
  }
  animate(vx,vy){
    if(vx||vy){ this.facing=Math.abs(vx)>=Math.abs(vy)?'s':(vy>0?'d':'u'); if(vx) this.player.setFlipX(vx<0); }
    if(this.facing!=='s') this.player.setFlipX(false);
    const st=this.state;
    const expression=st.phase>=4?'horrified':st.sanity<25?'scared':st.phase>=3?'worried':st.day<=2?'happy':'neutral';
    const key=`bob_${expression}_${vx||vy?'walk':'idle'}_${this.facing}`;
    if(this.player.anims.currentAnim?.key!==key) this.player.play(key);
    this.player.setDepth(this.player.y);
  }
}

/* ============================================================ BOOT */
const state=new CorruptionManager();
const game=new Phaser.Game({
  type:Phaser.AUTO,width:800,height:600,backgroundColor:'#87ceeb',physics:{default:'arcade'},scene:[TitleScene,RoomScene,ChaseScene,EndScene],
  callbacks:{preBoot:g=>{ g.registry.set('state',state); g.registry.set('audio',new Sound(state)); }},
});
// Debug: SHIFT + 1..9 jumps to that day, SHIFT + 0 jumps to Day 10 (plain 1/2 are dialogue choices)
window.addEventListener('keydown',e=>{
  const m=/^Digit([0-9])$/.exec(e.code);
  if(m&&e.shiftKey&&game.scene.isActive('Room')){
    state.day=+m[1]||10; state.sanity=100; state.resetDay();
    game.scene.getScene('Room').scene.restart({room:'town',spawn:[12,10]});
  }
});
</script>
